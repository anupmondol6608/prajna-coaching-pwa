<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3f8f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>প্রজ্ঞা কোচিং সেন্টার</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      margin: 0;
      padding: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    title="প্রজ্ঞা কোচিং সেন্টার"
    src="https://script.google.com/macros/s/AKfycbwlOfoBi1u4h_mpkbTJXCWbE6bTU8xJwIXyyAr95Pcfh_XGK3jRjdUe9ub6iq_5GvrRZg/exec?pwa_cache_bust=20261009_v2"
    allow="clipboard-read; clipboard-write"
    loading="eager">
  </iframe>

  <script>
    // Force the PWA shell/service worker to check for a new version.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const reg = await navigator.serviceWorker.register("./service-worker.js", {
            updateViaCache: "none"
          });
          await reg.update();
        } catch (err) {
          console.warn("PWA service worker update failed:", err);
        }
      });
    }
  </script>
</body>
</html>
